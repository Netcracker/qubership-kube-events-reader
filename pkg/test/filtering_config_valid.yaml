sinks:
  - name: "metrics"
    match:
      - type: "Warning"
        kind: "Pod|Deployment"
    exclude:
      - type: "Normal"
        message: ".*image.*"
      - reason: "Completed|Pulled|Started"
  - name: "logs"
    match:
      - type: "Warning"
    exclude:
      - reportingController: "nginx-ingress-controller"
messageAggregation:
  maxMessageLength: 128
  rules:
    - kind: "^SparkApplication$"
      message: "^failed to submit SparkApplication "
      value: "Failed to submit SparkApplication"
